name: laundry

x-php: &php
  image: ${LAUNDRY_RUNTIME_IMAGE:?Runtime image must be set}
  user: "1000:1000"
  working_dir: ${DEPLOY_ROOT:?Deployment directory must be set}/current
  volumes:
    - ${DEPLOY_ROOT}:${DEPLOY_ROOT}
  restart: unless-stopped
  init: true
  networks: [laundry]
  depends_on:
    db:
      condition: service_healthy
  security_opt: [no-new-privileges:true]

services:
  db:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=16M
      - --max-connections=32
      - --table-open-cache=256
      - --table-definition-cache=400
      - --temptable-max-ram=32M
      - --mysqlx=OFF
    mem_limit: 512m
    mem_reservation: 128m
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Database name must be set}
      MYSQL_USER: ${DB_USERNAME:?Database user must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Database password must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Root password must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [laundry]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute="SELECT 1" > /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  app:
    <<: *php
    mem_limit: 512m

  worker:
    <<: *php
    mem_limit: 384m
    command:
      [
        php,
        artisan,
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--backoff=60",
        "--timeout=60",
        "--max-time=3600",
        "--no-interaction",
      ]
    stop_grace_period: 75s

  scheduler:
    <<: *php
    mem_limit: 256m
    command: [php, artisan, "schedule:work", "--no-interaction"]
    stop_grace_period: 75s

  web:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:${APP_PORT:-8099}:80"
    environment:
      DEPLOY_ROOT: ${DEPLOY_ROOT}
      NGINX_ENVSUBST_FILTER: ^DEPLOY_ROOT$$
    volumes:
      - ${DEPLOY_ROOT}:${DEPLOY_ROOT}:ro
      - ${DEPLOY_ROOT}/current/deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on: [app]
    networks: [laundry]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'wget -q -O /dev/null --header="Host: laundry.karuhundeveloper.com" http://127.0.0.1/up',
        ]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql_data:

networks:
  laundry:
    ipam:
      config:
        - subnet: 172.30.99.0/24
