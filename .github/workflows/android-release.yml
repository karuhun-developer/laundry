name: Android release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare release metadata
        id: release
        run: .github/scripts/prepare-android-release.sh "$GITHUB_REF_NAME" CHANGELOG.md "$RUNNER_TEMP/release-notes.md"

      - name: Validate Android release configuration
        id: android_config
        env:
          PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          app_url="${PRODUCTION_APP_URL%/}"

          if [[ ! "$app_url" =~ ^https://[^/?#[:space:]]+(/[^?#[:space:]]*)?$ ]]; then
              echo 'PRODUCTION_APP_URL must be a valid HTTPS Laravel base URL.' >&2
              exit 1
          fi

          if [[ "$app_url" == */app ]]; then
              echo 'PRODUCTION_APP_URL must not include the /app mobile route.' >&2
              exit 1
          fi

          for variable_name in \
              ANDROID_KEYSTORE_BASE64 \
              ANDROID_KEYSTORE_PASSWORD \
              ANDROID_KEY_ALIAS \
              ANDROID_KEY_PASSWORD; do
              if [[ -z "${!variable_name}" ]]; then
                  echo "Missing required GitHub Actions secret: $variable_name" >&2
                  exit 1
              fi
          done

          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"
          echo "server_url=$app_url/app" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install application dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/database.sqlite
          php artisan migrate --force --no-interaction
          bun install --frozen-lockfile

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Build and sync Capacitor application
        env:
          APP_URL: ${{ steps.android_config.outputs.app_url }}
          CAPACITOR_SERVER_URL: ${{ steps.android_config.outputs.server_url }}
        run: |
          bun run build
          bun run android:sync

      - name: Run PHP quality gates
        run: composer ci:check

      - name: Run frontend unit tests
        run: bun run test

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/laundryhub-upload.jks"
          keytool -list \
              -keystore "$RUNNER_TEMP/laundryhub-upload.jks" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed APK and app bundle
        working-directory: android
        env:
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/laundryhub-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean bundleRelease assembleRelease

      - name: Remove decoded keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/laundryhub-upload.jks"

      - name: Prepare release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/laundryhub-$RELEASE_TAG.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-artifacts/laundryhub-$RELEASE_TAG.aab"
          cd release-artifacts
          sha256sum ./* > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES_PATH: ${{ steps.release.outputs.release_notes_path }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" \
                  --title "$RELEASE_TAG" \
                  --notes-file "$RELEASE_NOTES_PATH"
          else
              gh release create "$RELEASE_TAG" \
                  --verify-tag \
                  --title "$RELEASE_TAG" \
                  --notes-file "$RELEASE_NOTES_PATH"
          fi

          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
